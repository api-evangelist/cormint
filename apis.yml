aid: cormint
name: Cormint
description: 'Cormint Data Systems, Inc. is a Texas-based, vertically integrated developer
  and operator of power infrastructure for large-scale data centers and compute. The
  company designs, manufactures, deploys and operates its own electrical and site infrastructure
  in-house — from PDU wiring and PLC controls through transformer integration and substation
  work — and runs 130 MW energized today at its Fort Blocks site near Fort Stockton in
  West Texas, with a second 58 MW site (Bobcat) under construction near Orange Grove in
  ERCOT Load Zone South and a stated pipeline of roughly 370 MW across 707 controlled
  acres. Cormint built the operating platform in bitcoin mining, where it reports
  power costs of 2.3–3.1 cents per kWh and a #1 peer ranking on cost efficiency, and is
  now positioning the same platform for AI and HPC workloads as a colocation and
  EPC-style infrastructure owner-operator. It is an energy and data-center infrastructure
  business rather than a software vendor: it publishes no developer portal, no API, and
  no machine-readable specification of any kind.'
